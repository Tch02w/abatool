[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-tools"
version = "0.1.0"
description = "Unified desktop workspace for Abaqus job submission and ODB postprocessing"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "paramiko>=4.0,<5.0",
    "psutil>=5.9",
    "PySide6>=6.8",
    "Pillow>=11.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "XlsxWriter>=3.2",
    "pandas>=2.3.3",
    "openpyxl>=3.1,<4.0",
    "pandas-stubs~=2.3.3",
    "cycler>=0.12.1",
]

[project.gui-scripts]
abaqus-tools = "main:main"
abaqus-submitter = "modules.submitter.__main__:run"
abaqus-odb-post = "modules.postprocessor.app:main"
abaqus-odb-results = "modules.postprocessor.result_browser:main"

[project.scripts]
abaqus-tools-control = "modules.control_plane.__main__:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["GPTWork", ".venv", "bin", "obj", ".git"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.setuptools.package-data]
"modules.postprocessor" = ["defaults.json", "abaqus_scripts/*.py"]
